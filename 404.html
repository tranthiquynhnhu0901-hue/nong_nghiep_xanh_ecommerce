<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Không tìm thấy trang | Nông Nghiệp Xanh</title><style>body{font-family:system-ui,'Segoe UI',sans-serif;background:#f7f9f5;color:#1e3026;min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}main{text-align:center;max-width:500px}h1{font-size:66px;color:#1f6d42;margin:0}p{line-height:1.7}a{display:inline-block;background:#1f6d42;color:#fff;padding:12px 22px;border-radius:12px;text-decoration:none;font-weight:700}</style></head><body><main><h1>404</h1><h2>Không tìm thấy trang bạn cần</h2><p>Đường dẫn có thể đã thay đổi hoặc không tồn tại. Hãy trở về trang chủ để tiếp tục khám phá sản phẩm và kiến thức nông nghiệp.</p><a id="homeLink" href="/">Về trang chủ</a></main><script>const bits=location.pathname.split('/').filter(Boolean);if(location.hostname.endsWith('.github.io')&&bits.length>0){const account=location.hostname.split('.')[0];document.getElementById('homeLink').href=(bits[0]===account+'.github.io'?'/':'/'+bits[0]+'/');}</script></body></html>
