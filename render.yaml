# One web service: storefront, checkout, admin, SQLite and image AI.
# Paid Render plan needed because persistent disk is mandatory for orders/images.
services:
  - type: web
    name: nong-nghiep-xanh
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: persistent-store
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '22.16.0'
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1.5
      - key: DEMO_MODE
        value: '1'
      # After API key is configured, queue NEW illustrations automatically.
      # Each paid request counts towards the daily quota; all results await review.
      - key: AI_AUTO_ON_START
        value: '1'
      - key: AI_AUTO_TARGETS
        value: all
      - key: AI_AUTO_DAILY_LIMIT
        value: '3'
      - key: AI_AUTO_BATCH_SIZE
        value: '2'
      - key: AI_MAX_PER_HOUR
        value: '5'
      - key: AI_MAX_PER_DAY
        value: '10'
